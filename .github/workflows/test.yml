name: Tests

on:
  push:
    branches: [main, go]
  pull_request:
    branches: [main, go]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run tests
        run: go test ./... -v

      - name: Build
        run: go build -ldflags="-s -w" -o skinx ./cmd/skinx/
