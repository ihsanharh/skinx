[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skinx"
version = "1.2.0"
description = "Minecraft Bedrock Skin Pack Tool"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "ihsanharh" }]
dependencies = ["cryptography>=49.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
skinx = "skinx.cli:main"

[tool.setuptools.packages.find]
include = ["skinx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
